name: spike-wrapper
description: >-
  Throwaway action for issue #37. Calls spike-echo via a relative reference
  from inside a composite action, to test whether action-to-action nesting
  resolves the same way as a workflow-step reference. Deleted once the
  spike concludes.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/spike-echo
