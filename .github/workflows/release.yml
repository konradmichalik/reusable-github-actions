name: Release

on:
  workflow_call:

permissions: {}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub release
    outputs:
      release-notes-url: ${{ steps.create-release.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$REF_NAME" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::Tag '$REF_NAME' is not a release version. Expected N.N.N, each part 1-3 digits, for example 1.2.3 — no 'v' prefix and no suffix."
            exit 1
          fi

      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
