name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install zizmor==1.29.0

      - name: Run zizmor
        run: zizmor .github/workflows/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            shellcheck -s sh scripts/*.sh
          else
            echo "no scripts/*.sh yet, nothing to check"
          fi

  check-relative-uses:
    name: check-relative-uses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for relative step-level references
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-relative-uses.py

  check-action-pins:
    name: check-action-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A floating tag (e.g. @v7) can be moved to point at different code
      # after review. A full 40-character commit SHA cannot. Docker digest
      # refs (@sha256:...) and local reusable-workflow paths (./...) are
      # already content-addressed or repo-local and are exempt.
      - name: Check that all actions are pinned to a full commit SHA
        run: |
          set -euo pipefail
          status=0
          for file in .github/workflows/*.yml; do
            while IFS= read -r line; do
              ref=$(printf '%s\n' "$line" | grep -oE 'uses:[[:space:]]*[^[:space:]]+' | sed -E 's/uses:[[:space:]]*//')
              [ -z "$ref" ] && continue
              case "$ref" in
                ./*) continue ;;
              esac
              pin="${ref##*@}"
              if [ "$pin" = "$ref" ]; then
                continue
              fi
              case "$pin" in
                sha256:*) continue ;;
              esac
              if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error file=${file}::Action not pinned to a full commit SHA: ${ref}"
                status=1
              fi
            # Anchored to an actual YAML key (optional list dash, then `uses:`)
            # rather than `uses:` anywhere on the line. Unanchored, any prose that
            # happens to contain the word — a deprecation notice quoting a caller
            # snippet, for instance — was reported as an unpinned action.
            done < <(grep -E '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*' "$file")
          done
          exit "$status"
