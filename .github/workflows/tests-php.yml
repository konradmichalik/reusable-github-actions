name: Tests (PHP)

on:
  workflow_call:
    inputs:
      php-versions:
        description: 'PHP versions as JSON array'
        required: false
        default: '["8.1", "8.2", "8.3", "8.4"]'
        type: string
      dependencies:
        description: 'Dependencies as JSON array'
        required: false
        default: '["highest", "lowest"]'
        type: string
      coverage-dir:
        description: 'Directory your test:coverage script writes clover.xml to'
        required: false
        default: '.build/coverage'
        type: string
      coveralls:
        description: 'Upload coverage to Coveralls. Turn off if the repository is not enabled there'
        required: false
        default: true
        type: boolean

permissions: {}

# No `concurrency` here on purpose. A caller may invoke this workflow N times
# from its own matrix, and the callee cannot see the caller's matrix values,
# so any group it builds would be identical for all N and they would cancel
# or queue each other. Concurrency for the test workflows is the caller's job.

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php-version }} & ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(inputs.php-versions || '["8.1", "8.2", "8.3", "8.4"]') }}
        dependencies: ${{ fromJson(inputs.dependencies || '["highest", "lowest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      # Install dependencies
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Run tests
      - name: Run tests
        run: composer test

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: pcov

      # Install dependencies
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Run tests
      - name: Build coverage directory
        run: mkdir -p .build/coverage
      - name: Run tests with coverage
        run: composer test:coverage

      # Upload artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: ${{ inputs.coverage-dir }}/clover.xml
          retention-days: 7

  coverage-report:
    name: Report test coverage
    # Coveralls is the only thing this job does, so skip the whole job rather
    # than checking out and downloading an artifact to do nothing with. Fork
    # pull requests are excluded: the upload needs a token the fork cannot
    # have, and failing there would red-flag an otherwise fine contribution.
    if: >-
      inputs.coveralls
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Download artifact
      - name: Download coverage artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      # Coveralls
      - name: Coveralls report
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: ${{ steps.download.outputs.download-path }}/clover.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}
