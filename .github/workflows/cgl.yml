name: CGL

on:
  workflow_call:
    inputs:
      php-version:
        required: false
        default: '8.2'
        type: string

permissions: {}

jobs:
  cgl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          # @todo Use PHP 8.4 once PHP-CS-Fixer supports PHP 8.4
          php-version: ${{ inputs.php-version }}
          tools: composer:v2, composer-require-checker, composer-unused, cs2pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Validation
      - name: Validate composer.json
        run: composer validate

      # Install dependencies
      - name: Add required packages
        run: composer require composer/composer:"^2.2"

      # Check Composer dependencies
      - name: Check dependencies
        run: composer-require-checker check
      - name: Reset composer.json
        run: |
          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            git checkout composer.json composer.lock
          else
            git checkout composer.json
          fi
      - name: Re-install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Check for unused dependencies
        run: composer-unused

      # Linting
      - name: Refresh composer.lock hash
        run: composer update --lock
      - name: Lint composer.json
        run: composer lint:composer
      - name: Lint Editorconfig
        run: composer lint:editorconfig
      - name: Lint PHP
        run: composer lint:php -- --format checkstyle | cs2pr

      # SCA
      - name: SCA PHP
        run: composer sca:php -- --error-format github

      # Migration
      - name: Run Rector migration
        run: composer migration:rector -- --dry-run
