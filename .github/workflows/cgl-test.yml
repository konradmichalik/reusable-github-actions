name: CGL

on:
  workflow_call:
    inputs:
      php-version:
        required: false
        default: '8.2'
        type: string
      sca-typo3-version:
        description: 'Additional TYPO3 version to run static analysis against, e.g. "14.3". The cgl job analyses the locked one. Empty skips the job'
        required: false
        default: ''
        type: string
      sca-typo3-script:
        description: 'cgl target for the additional static analysis, e.g. a script that loads a version-specific PHPStan config'
        required: false
        default: 'sca:php'
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-cgl-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cgl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # @todo Use PHP 8.4 once PHP-CS-Fixer supports PHP 8.4
          php-version: ${{ inputs.php-version }}
          tools: composer:v2, composer-require-checker, composer-unused, cs2pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Validation
      - name: Validate composer.json
        run: composer validate

      # Install dependencies
      - name: Add required packages
        run: composer require composer/composer:"^2.2"

      # Check Composer dependencies
      - name: Check dependencies
        run: composer-require-checker check
      - name: Reset composer.json
        run: |
          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            git checkout composer.json composer.lock
          else
            git checkout composer.json
          fi
      - name: Re-install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Check for unused dependencies
        run: composer-unused

      # Linting
      - name: Refresh composer.lock hash
        run: composer update --lock
      - name: Lint composer.json
        run: composer cgl lint:composer
      - name: Lint Editorconfig
        run: composer cgl lint:editorconfig
      - name: Lint PHP
        run: composer cgl lint:php -- --format checkstyle | cs2pr

      # SCA
      - name: SCA PHP
        run: composer cgl sca:php -- --error-format github

      # Migration
      - name: Run Rector migration
        run: composer cgl migration:rector -- --dry-run

  sca-typo3:
    name: SCA on additional TYPO3 version
    if: inputs.sca-typo3-version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2

      # Resolve the lock file for the requested TYPO3 version, then install from it like
      # the cgl job does, so the consumer's install hooks (e.g. nested tool projects) run.
      - name: Update composer.lock
        run: composer update --no-install --no-progress --with="typo3/cms-core:^$TYPO3_VERSION"
        env:
          TYPO3_VERSION: ${{ inputs.sca-typo3-version }}
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # SCA
      - name: SCA PHP
        run: composer cgl "$SCRIPT" -- --error-format github
        env:
          SCRIPT: ${{ inputs.sca-typo3-script }}
