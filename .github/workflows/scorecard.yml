name: OpenSSF Scorecard

# Supply-chain posture scoring (branch protection, pinned actions, token
# permissions, ...). Runs on default-branch push and weekly; results upload to
# the code-scanning dashboard and publish the public Scorecard badge.
# Dual-trigger: runs on this repo directly and is callable as a reusable
# workflow by consumers (which supply their own push/schedule triggers).

on:
  workflow_call:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # scorecard-action only supports the default branch and hard-fails on any
    # other ref ("only default branch is supported"). A careless caller trigger
    # (e.g. push: branches: ['**']) would otherwise put a guaranteed-red check
    # on every feature-branch push. Skip cleanly (neutral, not failed) unless we
    # are on the default branch, a schedule, or a manual dispatch. The github
    # context here is the caller's, so default_branch resolves to the caller repo.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      security-events: write # upload SARIF to code-scanning
      id-token: write # publish results to OpenSSF
      actions: read # read workflow run data for checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
